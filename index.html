<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Rasoii Tables</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Theme: black and orange, one dark look on purpose. Layout: guest = phone column with bottom tabs; kitchen = three ticket lanes; floor = table map + detail panel. */
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --surface:#161617; --surface2:#232325; --ink:#f4efe8; --muted:#a79f94; --line:#323235;
  --brand:#ff9a0e; --brand-ink:#170d00; --accent:#ff9a0e; --accent-soft:#33250a;
  --new:#6ea8ff; --new-soft:#14233f; --prep:#ffb340; --prep-soft:#33260b; --ready:#4cd08a; --ready-soft:#10301e; --alert:#ff6a55; --alert-soft:#3d1713;
  --veg:#4cd08a; --nonveg:#ff6a55;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.guest{max-width:520px;margin:0 auto;padding-bottom:84px}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.warn{background:var(--alert);color:#fff;border-color:var(--alert)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:grid;gap:12px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.brandmark{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brandmark{display:flex;align-items:center;gap:8px}
.logo{width:38px;height:38px;flex:none}
.legal{font-size:12px;color:var(--muted);line-height:1.5}
.bill{gap:10px}
.bhead{display:flex;gap:10px;align-items:center}
.bhead .logo{width:46px;height:46px}
.bmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0}
.blines{display:grid;gap:6px}
.bl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline}
.bl .bq{color:var(--muted);min-width:26px}
.bl .bn{min-width:0;overflow-wrap:anywhere}.bl small{color:var(--muted)}
.bill .totals{border-top:1px dashed var(--line);padding-top:8px}
.bill .totals .sub{font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.qrcard{display:grid;justify-items:center;gap:8px;text-align:center;padding:18px 14px;border-radius:18px;color:#170d00;background:radial-gradient(120% 90% at 50% 0%,#ffc968 0%,#ff9a0e 55%,#e27c00 100%)}
.qrtitle{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.qramt{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.qrbox{position:relative;width:236px;max-width:100%;background:#fff;padding:12px;border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.qrbox svg{display:block;width:100%;height:auto}
.qrlogo{position:absolute;left:50%;top:50%;width:15%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;padding:3px}
.qrapps{font-size:13px;font-weight:600}.qrid{font-size:13px}.qrnote{font-size:12px;color:#3a2300}
.qrcard .btn{background:#170d00;border-color:#170d00;color:#ffb340;text-decoration:none}

.brandmark small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{padding:7px 13px;border-radius:99px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.nav a.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
/* guest */
.ghead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabletag{font-family:var(--display);font-weight:800;font-size:13px;background:var(--ink);color:var(--bg);border-radius:8px;padding:3px 9px;margin-left:8px;vertical-align:middle}
.item{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{font-size:17px}
.vegmark{display:inline-block;width:14px;height:14px;border:2px solid var(--veg);border-radius:3px;position:relative;vertical-align:-2px;margin-right:6px}
.vegmark::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--veg)}
.vegmark.nv{border-color:var(--nonveg)}.vegmark.nv::after{background:var(--nonveg)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:7px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--line)}
.pips i.on{background:var(--alert)}
.al{font-size:12px;color:var(--muted)}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.size{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.size.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.bottomnav .cartbar{flex:none;position:static;width:100%;max-width:520px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bottomnav div{display:flex;gap:6px;width:100%;max-width:520px}
.bottomnav button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:600;color:var(--muted);position:relative}
.bottomnav button.on{background:var(--surface2);color:var(--ink)}
.badge{background:var(--alert);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:5px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.steps span{font-size:11px;text-align:center;color:var(--muted);border-top:4px solid var(--line);padding-top:4px}
.steps span.done{border-color:var(--ready);color:var(--ink);font-weight:600}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.totals{display:grid;gap:4px}
.totals div{display:flex;justify-content:space-between}
.totals .big{font-family:var(--display);font-weight:800;font-size:22px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.method{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;text-align:left;font-weight:600}
.method.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.method small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;line-height:1;border:0;background:none;color:var(--line);padding:2px}
.stars button.on{color:var(--accent)}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.pick{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border:0}
.pick input{width:18px;height:18px;accent-color:var(--brand)}
.wifi{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px}
.wifi .muted{color:inherit;opacity:.7}
.wifi code{font-family:var(--body);font-weight:700;font-size:16px;letter-spacing:.02em}
.wifi .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}
/* kitchen */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:860px){.lanes{grid-template-columns:1fr}}
.lane h2{font-size:18px;display:flex;justify-content:space-between;margin-bottom:10px}
.ticket{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px;margin-bottom:10px;border-left-width:6px}
.ticket.s-new{border-left-color:var(--new)}.ticket.s-preparing{border-left-color:var(--prep)}.ticket.s-ready{border-left-color:var(--ready)}
.ticket.late{background:var(--alert-soft)}
.ticket .tno{font-family:var(--display);font-weight:800;font-size:22px}
.ticket ul{list-style:none;margin:8px 0;padding:0;display:grid;gap:3px}
.ticket li b{display:inline-block;min-width:26px}
.age{font-size:13px;font-weight:600}
.late .age{color:var(--alert)}
.note{background:var(--accent-soft);border-radius:8px;padding:6px 9px;font-size:13px}
/* floor */
.floorgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.floorgrid{grid-template-columns:1fr}}
.zone{margin-bottom:14px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:8px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;min-height:92px;display:grid;align-content:space-between;gap:6px}
.tile.sel{box-shadow:0 0 0 3px var(--accent)}
.tile .tn{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.tile .st{font-size:12px;font-weight:600}
.tile.free{border-style:dashed}.tile.free .st{color:var(--muted)}
.tile.ordered{border-color:var(--new)}.tile.ordered .st{color:var(--new)}
.tile.ready{border-color:var(--ready);background:var(--ready-soft)}.tile.ready .st{color:var(--ready)}
.tile.dining{border-color:var(--prep)}.tile.dining .st{color:var(--prep)}
.tile.pay{border-color:var(--accent);background:var(--accent-soft)}
.tile.call{border-color:var(--alert);background:var(--alert-soft);animation:pulse 1.6s ease-in-out infinite}
.tile.call .st{color:var(--alert)}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--alert) 25%,transparent)}}
@media(prefers-reduced-motion:reduce){.tile.call{animation:none}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.kpi b{font-family:var(--display);font-size:24px;display:block}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.qrcard{text-align:center}
.qrbox{background:#fff;border-radius:10px;padding:8px;margin-bottom:8px;display:grid;place-items:center}
.qrbox svg{width:100%;height:auto;max-width:160px;display:block}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.home{align-items:start}
.home a.card{text-decoration:none;color:inherit;display:grid;gap:6px}
.home a.card:hover{border-color:var(--brand)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:60;max-width:92vw;display:none}
.demo{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
/* games */
.gcards{display:grid;gap:10px}
.gcard{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.gcard:hover{border-color:var(--brand)}
.gcard b{font-family:var(--display);font-size:19px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.ttt button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:40px}
.ttt button.x{color:var(--brand)}.ttt button.o{color:var(--alert)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem button{aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;padding:2px}
.mem button.up{background:var(--c,var(--brand));color:#fff;border-color:transparent}
.mem button.done{opacity:.45}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:12px}
.dpad button{border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.dpad .u{grid-column:2}.dpad .l{grid-row:2;grid-column:1}.dpad .dn{grid-row:2;grid-column:2}.dpad .r{grid-row:2;grid-column:3}
.bar{height:10px;border-radius:5px;background:var(--brand);min-width:2px}
.barrow{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:10px;align-items:center;font-size:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:18px 0}
.pinpad button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:22px}
.pindots{display:flex;gap:12px;justify-content:center}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.pindots i.on{background:var(--ink)}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow.off{opacity:.55}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fgrid label{display:grid;gap:4px;font-size:13px;font-weight:600}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.alchk{display:inline-flex;gap:5px;align-items:center;font-size:13px;margin-right:10px}
.cartchip{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ghead .row{flex-wrap:nowrap;gap:6px;flex:none}
.ghead .btn{white-space:nowrap}
.ghead .brandmark{font-size:17px;min-width:0}
.ghead .logo{width:32px;height:32px}
.ghead .brandmark>span{display:flex;flex-direction:column;align-items:flex-start;gap:3px;line-height:1.05}
.ghead .tabletag{margin-left:0;white-space:nowrap;font-size:12px}
.tcard{text-align:center;display:grid;gap:6px;align-content:start}
.tbox{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center}
.tbox svg{display:block;width:100%;height:auto;max-width:170px}
</style>

<div id="app"></div>
<div id="toast" role="status"></div>

<script>

const CFG={link:'',pin:'1998',name:'The Rasoii',firm:'Taste And Celebrate Harmony Enterprises',gstin:'10AAVFT2790B1Z8',

  upi:'9164688396@okbizaxis',bank:'Taste And Celebrate Harmony Enterprises · add account number and IFSC in the config',

function szParse(t){return String(t||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.lastIndexOf(':');return [s.slice(0,i).trim(),Math.max(0,+s.slice(i+1))||0]}).filter(x=>x[0])}
function allItems(){return D.menu.length?D.menu.slice().sort((a,b)=>(a.ord||0)-(b.ord||0)).map(m=>({...m,sz:szParse(m.szText),al:m.al||[]})):MENU.map(m=>({...m,off:false}))}
function liveItems(){return allItems().filter(m=>!m.off&&m.sz.length)}
function catList(items){const s=[];items.forEach(m=>{if(!s.includes(m.cat))s.push(m.cat)});return s}

/* ---------- Store: shared db when available, in-memory otherwise ---------- */
const D={orders:[],tables:[],payments:[],reviews:[],menu:[]};
const LOCAL_STORE_KEY='therasoii_demo_store_v1';
const store={db:null,mem:false,subs:{},m:{orders:{},tables:{},payments:{},reviews:{},menu:{}},
  persistLocal(){
    try{localStorage.setItem(LOCAL_STORE_KEY,JSON.stringify(this.m));return true}catch(e){return false}
  },
  async del(c,id){if(this.db)return this.db.collection(c).doc(id).delete();delete this.m[c][id];this.persistLocal();this.flush(c);paint()},
  async init(onChange){
    try{this.db=await window.claude?.use?.('db')}catch(e){this.db=null}
    for(const c of Object.keys(D)){
      if(this.db){
        this.db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(x=>({id:x.id,...x.data()}));onChange()},()=>{});
      }
    }
    if(!this.db){
      this.mem=true;
      let restored=false;
      try{
        const saved=localStorage.getItem(LOCAL_STORE_KEY);
        if(saved){const parsed=JSON.parse(saved);if(parsed&&typeof parsed==='object'){
          for(const c of Object.keys(D))this.m[c]=parsed[c]&&typeof parsed[c]==='object'?parsed[c]:{};
          restored=true;
        }}
      }catch(e){}
      if(!restored){seedMemory();this.persistLocal()}
      for(const c of Object.keys(D))this.flush(c);
      onChange();
    }
  },
  flush(c){D[c]=Object.entries(this.m[c]).map(([id,v])=>({id,...v}))},
  async set(c,id,v){if(this.db)return this.db.collection(c).doc(id).set(v);this.m[c][id]=v;this.persistLocal();this.flush(c);paint()},
  async update(c,id,v){if(this.db)return this.db.collection(c).doc(id).update(v);this.m[c][id]={...(this.m[c][id]||{}),...v};this.persistLocal();this.flush(c);paint()}
};

const tOrders=n=>D.orders.filter(o=>o.table===n&&!o.closed).sort((a,b)=>a.t-b.t);
const tPays=n=>D.payments.filter(p=>p.table===n&&!p.closed);
const lineTotal=o=>sum(o.items.map(i=>i.qty*i.price));
const billTotal=n=>sum(tOrders(n).map(lineTotal));
const paidAmt=n=>sum(tPays(n).map(p=>p.amount));

function tableState(n){
  if(tCall(n))return{k:'call',label:tCall(n)==='bill'?'Wants the bill':'Calling waiter'};
  const os=tOrders(n),ps=tPays(n);
  if(ps.some(p=>p.status==='pending'))return{k:'pay',label:'Confirm payment'};
  if(!os.length)return{k:'free',label:'Free'};
  if(os.some(o=>o.status==='ready'))return{k:'ready',label:'Food ready'};
  if(os.some(o=>o.status==='new'||o.status==='preparing'))return{k:'ordered',label:'Ordered'};
  if(billTotal(n)-paidAmt(n)<=0)return{k:'pay',label:'Paid, clear table'};
  return{k:'dining',label:'Dining'};
}

/* ---------- Render ---------- */
let dirty=false;
function paint(force){
  const a=document.activeElement;
  if(!force&&a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.dataset.bind){dirty=true;return}
  dirty=false;
  const v=st.view;
  if(!force&&v==='guest'&&st.tab==='play'&&$('#gamearea')){ /* keep the running game, refresh only header and tabs */
    const t=document.createElement('div');t.innerHTML=guestView();
    for(const s of ['.ghead','.bottomnav']){const n=t.querySelector(s),o=$(s);if(n&&o)o.replaceWith(n)}
    return}
  if(STAFF.includes(v)&&!st.staff){stopGame();$('#app').innerHTML=pinView();return}
  stopGame();
  $('#app').innerHTML=v==='guest'?guestView():v==='kitchen'?kitchenView():v==='bills'?billsView():v==='floor'?floorView():v==='qr'?qrView():v==='sales'?salesView():v==='menu'?menuView():homeView();
  if(v==='guest'){saveCart();if(st.tab==='play')gamePicker()}
}
addEventListener('focusout',()=>{if(dirty)setTimeout(()=>paint(),50)});

/* kitchen alert on new tickets */
function checkNew(){
  const ids=new Set(D.orders.filter(o=>o.status==='new'&&!o.closed).map(o=>o.id));
  if(st.seen&&st.beep&&st.view==='kitchen'&&[...ids].some(i=>!st.seen.has(i)))beepNow();
  st.seen=ids;
}
function beepNow(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}}

/* ---------- Actions ---------- */
async function safe(fn,msg){try{await fn();if(msg)toast(msg)}catch(e){toast('That did not save. Check your connection and try again.')}}
const A={
  settable:e=>{st.table=+e.n;paint(true)},
  tab:e=>{st.tab=e.t;paint(true);scrollTo(0,0)},
  cat:e=>{st.cat=e.c;paint(true)},
  veg:()=>{st.veg=!st.veg;paint(true)},
  avoid:e=>{st.avoid.has(e.a)?st.avoid.delete(e.a):st.avoid.add(e.a);paint(true)},
  size:e=>{st.sel[e.id]=+e.i;paint(true)},
  add:e=>{const m=liveItems().find(x=>x.id===e.id);if(!m)return;const i=Math.min(st.sel[e.id]||0,m.sz.length-1),[sn,p]=m.sz[i];const f=st.cart.find(c=>c.id===m.id&&c.size===sn);
    f?f.qty++:st.cart.push({id:m.id,name:m.name,size:sn,qty:1,price:p});toast(m.name+' added');paint(true)},
  inc:e=>{st.cart[+e.i].qty++;paint(true)},
  dec:e=>{const c=st.cart[+e.i];c.qty--;if(c.qty<=0)st.cart.splice(+e.i,1);paint(true)},
  place:()=>{if(!st.cart.length)return;const items=st.cart.map(c=>({...c}));const id=uid();
    safe(async()=>{await store.set('orders',id,{table:st.table,items,note:st.note.trim(),status:'new',t:Date.now(),closed:false});st.cart=[];st.note='';paint(true)},'Order sent to the kitchen')},
  call:()=>safe(()=>store.set('tables','t'+st.table,{call:'waiter',at:Date.now()}),'Your waiter has been called'),
  copy:e=>{const v=e.v;(navigator.clipboard?.writeText(v)||Promise.reject()).then(()=>toast('Copied'),()=>toast('Copy this: '+v))},
  paymode:e=>{st.pay.mode=e.m;paint(true)},
  pickitem:(e,el)=>{el.checked?st.pay.picked.add(e.k):st.pay.picked.delete(e.k);paint(true)},
  splitdec:()=>{st.pay.split=Math.max(2,st.pay.split-1);paint(true)},
  splitinc:()=>{st.pay.split=Math.min(10,st.pay.split+1);paint(true)},
  tip:e=>{st.pay.tip=e.t==='custom'?'custom':+e.t;paint(true)},
  method:e=>{st.pay.method=e.m;paint(true)},
  pay:()=>{
    const n=st.table,p=st.pay,os=tOrders(n),pk=paidKeys(n),bill=billTotal(n),rem=bill-paidAmt(n);
    const lines=os.flatMap(o=>o.items.map((it,i)=>({key:o.id+':'+i,...it})));
    const picked=lines.filter(l=>p.picked.has(l.key)&&!pk.has(l.key));
    let base=rem;if(p.mode==='pick')base=sum(picked.map(l=>l.qty*l.price));if(p.mode==='split')base=Math.min(rem,Math.ceil(bill/p.split));
    if(base<=0)return;
    const tip=p.tip==='custom'?Math.max(0,+p.custom||0):Math.round(base*p.tip/100);
    const pending=true;
    const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    safe(async()=>{await store.set('payments',id,{table:n,amount:base,tip,method:p.method,status:pending?'pending':'paid',t:Date.now(),keys:p.mode==='pick'?picked.map(l=>l.key):[],closed:false});
      p.picked=new Set();paint(true)},pending?'Staff will confirm your payment':'Payment received');
  },
  dlbill:e=>{
    const n=+((e&&e.n)||st.table);let buf=null;try{buf=billPDF(n)}catch(err){}
    if(!buf){toast('Could not make the bill');return}
    const name='Rasoii-bill-table-'+n+'.pdf',blob=new Blob([buf],{type:'application/pdf'});
    if(DL){DL.save({filename:name,data:blob}).then(()=>toast('Bill saved')).catch(x=>{if(!x||x.code!=='declined')toast('Could not save the bill here')});return}
    try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Bill saved')}catch(err){toast('Could not save the bill here')}
  },
  rate:e=>{st.rating=+e.r;st.reviewSent=true;safe(()=>store.set('reviews',st.reviewId,{table:st.table,rating:st.rating,text:st.reviewText,t:Date.now()}),'Thank you for rating us');paint(true)},
  sendtext:()=>safe(()=>store.set('reviews',st.reviewId,{table:st.table,rating:st.rating,text:st.reviewText.trim(),t:Date.now()}),'Comment sent'),
  advance:e=>{const o=D.orders.find(x=>x.id===e.id);if(!o)return;const nx=FLOW[FLOW.indexOf(o.status)+1];if(nx)safe(()=>store.update('orders',o.id,{status:nx,...(nx==='preparing'?{startedAt:Date.now()}:{}),...(nx==='ready'?{readyAt:Date.now()}:{})}))},
  beep:()=>{st.beep=!st.beep;if(st.beep)beepNow();paint(true)},
  seltable:e=>{st.floorSel=+e.n;paint(true)},
  attend:e=>safe(()=>store.set('tables','t'+e.n,{call:null,at:Date.now()}),'Marked as attended'),
  confirmpay:e=>safe(()=>store.update('payments',e.id,{status:'paid'}),'Payment confirmed'),
  clear:e=>{const n=+e.n;safe(async()=>{for(const o of tOrders(n))await store.update('orders',o.id,{closed:true});
    for(const p of tPays(n))await store.update('payments',p.id,{closed:true});
    if(tCall(n))await store.set('tables','t'+n,{call:null,at:Date.now()});},'Table '+n+' cleared')},
  sample:()=>safe(async()=>{const now=Date.now(),mk=(t,items,status,mins,note='')=>store.set('orders',uid(),{table:t,items,note,status,t:now-mins*60000,closed:false});
    await mk(3,[{id:'i24',name:'Paneer Tikka Chatpata',size:'Regular',qty:1,price:320},{id:'i0',name:'Butter Naan',size:'1 pc',qty:3,price:55}],'preparing',9,'Sample order');
    await mk(5,[{id:'i0',name:'Chicken Dum Biryani',size:'Regular',qty:1,price:270}],'new',2);
    await mk(7,[{id:'i0',name:'Chicken Butter Masala',size:'Regular',qty:1,price:460}],'ready',16);
    await store.set('tables','t5',{call:'waiter',at:now-120000})},'Sample orders added')
};

   <div class="home">
    <div class="card stack"><h2 style="font-size:20px">Best sellers</h2>${barRows(top,v=>v+' sold')}</div>
    <div class="card stack"><h2 style="font-size:20px">Payment methods</h2>${barRows(Object.entries(meth).sort((a,b)=>b[1]-a[1]),inr)}</div>
    <div class="card stack"><h2 style="font-size:20px">Latest reviews</h2>${latest.length?latest.map(r=>`<div><b>${'★'.repeat(r.rating)}<span style="color:var(--line)">${'★'.repeat(5-r.rating)}</span></b> <span class="al">Table ${r.table} · ${age(r.t)} ago</span>${r.text?`<div>${esc(r.text)}</div>`:''}</div>`).join(''):'<div class="muted">No reviews yet.</div>'}</div>
   </div></div>`;
}

/* ---------- Menu editor ---------- */
function menuView(){
  const items=allItems(),seeded=D.menu.length>0,sel=st.menuSel;
  const cur=sel==='new'?{id:'new',cat:'',name:'',d:'',veg:1,spice:0,al:[],szText:'',off:false}:items.find(m=>m.id===sel);
  const cats=catList(items);
  const list=cats.map(c=>`<div><span class="label">${esc(c)}</span>${items.filter(m=>m.cat===c).map(m=>`<div class="mrow ${m.off?'off':''}"><div style="min-width:0"><span class="vegmark ${m.veg?'':'nv'}"></span><b>${esc(m.name)}</b><div class="al">${m.sz.map(s=>esc(s[0])+' '+inr(s[1])).join(' · ')||'No sizes'}</div></div>
     <div class="row" style="flex-wrap:nowrap"><button class="btn small" data-act="toggleoff" data-id="${m.id}">${m.off?'Sold out':'Available'}</button><button class="btn small" data-act="editmenu" data-id="${m.id}">Edit</button></div></div>`).join('')}</div>`).join('');
  const form=cur?`<div class="card stack"><h2 style="font-size:20px">${sel==='new'?'New dish':'Edit dish'}</h2>
    <div class="fgrid"><label>Name<input type="text" id="mf-name" data-bind="_" value="${esc(cur.name)}"></label>
     <label>Category<input type="text" id="mf-cat" data-bind="_" list="catlist" value="${esc(cur.cat)}"><datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label></div>
    <label class="al" for="mf-d">Description</label><textarea id="mf-d" rows="2" data-bind="_">${esc(cur.d)}</textarea>
    <label class="al" for="mf-sz">Sizes and prices, comma separated, like Half:220, Full:380</label><input type="text" id="mf-sz" data-bind="_" value="${esc(cur.szText||(cur.sz||[]).map(s=>s[0]+':'+s[1]).join(', '))}">
    <div class="fgrid"><label>Spice level<select id="mf-spice">${[0,1,2,3].map(n=>`<option value="${n}" ${+cur.spice===n?'selected':''}>${['None','Mild','Medium','Hot'][n]}</option>`).join('')}</select></label>
     <label>Type<select id="mf-veg"><option value="1" ${cur.veg?'selected':''}>Vegetarian</option><option value="0" ${cur.veg?'':'selected'}>Non-vegetarian</option></select></label></div>
    <div><span class="label">Contains</span><div style="margin-top:6px">${ALLERGENS.map(a=>`<label class="alchk"><input type="checkbox" class="mf-al" value="${a}" ${(cur.al||[]).includes(a)?'checked':''}>${a}</label>`).join('')}</div></div>
    <div class="row"><button class="btn primary" data-act="savemenu">Save dish</button><button class="btn" data-act="cancelmenu">Cancel</button>${sel!=='new'?`<button class="btn warn" data-act="delmenu" data-id="${sel}" style="margin-left:auto">Delete</button>`:''}</div></div>`
    :`<div class="empty">Pick a dish to edit, or add a new one.</div>`;
  return `<div class="wrap">${nav()}<div class="row spread" style="margin-bottom:12px"><h1 style="font-size:30px">Menu</h1><button class="btn primary" data-act="newmenu">Add dish</button></div>
   ${seeded?'':`<div class="demo">You are looking at the built-in sample menu. Your first edit saves your own copy, which guests then see.</div>`}
   <div class="floorgrid"><div class="card">${list}</div><div>${form}</div></div></div>`;
}
async function seedMenu(){for(const [i,m] of MENU.entries())await store.set('menu',m.id,{cat:m.cat,name:m.name,d:m.d,veg:m.veg,spice:m.spice,al:m.al,szText:m.sz.map(s=>s[0]+':'+s[1]).join(', '),off:false,ord:i})}

/* ---------- Games ---------- */
const G={stop:null,ttt:{w:0,l:0,d:0},memBest:0,snakeBest:0};
function stopGame(){if(G.stop){try{G.stop()}catch(e){}G.stop=null}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function playTab(){
  const os=tOrders(st.table).filter(o=>o.status!=='served');
  const s=os.some(o=>o.status==='ready')?'Your food is ready. Your waiter is bringing it.':os.some(o=>o.status==='preparing')?'The chef is cooking your order.':os.length?'The kitchen has your order.':'Order something and the games keep you company.';
  return `<div class="stack"><div class="card"><span class="label">While you wait</span><div style="font-weight:600;margin-top:2px">${s}</div></div><div id="gamearea"></div></div>`;
}
function gamePicker(){
  stopGame();const a=$('#gamearea');if(!a)return;
  a.innerHTML=`<div class="gcards">
   <button class="gcard" data-act="game" data-g="ttt"><b>Tic-tac-toe</b><span class="muted">You are X. Beat the kitchen computer.</span></button>
   <button class="gcard" data-act="game" data-g="mem"><b>Memory match</b><span class="muted">Find the six pairs of dishes in the fewest moves.</span></button>
   <button class="gcard" data-act="game" data-g="snake"><b>Snake</b><span class="muted">Swipe or tap arrows. Eat the chillies, don't hit the walls.</span></button></div>`;
}
function gameShell(title){
  const a=$('#gamearea');
  a.innerHTML=`<div class="stack" style="gap:10px"><div class="row spread"><button class="btn small" data-act="gback">All games</button><b id="gscore" class="num"></b></div><h2 style="font-size:22px">${title}</h2><div id="gbody"></div></div>`;
  return $('#gbody');
}
function gameTTT(){
  const body=gameShell('Tic-tac-toe'),sc=G.ttt;let b,over;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=(b,p)=>L.some(l=>l.every(i=>b[i]===p));
  const mm=(b,p)=>{if(win(b,'O'))return 1;if(win(b,'X'))return -1;if(b.every(Boolean))return 0;
    let best=p==='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p==='O'?'X':'O');b[i]='';best=p==='O'?Math.max(best,s):Math.min(best,s)}return best};
  const draw=msg=>{body.innerHTML=`<div class="ttt">${b.map((c,i)=>`<button data-i="${i}" class="${c.toLowerCase()}" ${c||over?'disabled':''} aria-label="Square ${i+1} ${c}">${c}</button>`).join('')}</div>
    <p class="muted" style="text-align:center">${msg}</p><div style="text-align:center"><button class="btn small" data-new="1">New game</button></div>`;
    $('#gscore').textContent=`You ${sc.w} · Me ${sc.l} · Draw ${sc.d}`};
  const reset=()=>{b=Array(9).fill('');over=false;draw('Your move')};
  const end=()=>{if(win(b,'X')){sc.w++;over=true;draw('You win!');return true}
    if(win(b,'O')){sc.l++;over=true;draw('I win this one.');return true}
    if(b.every(Boolean)){sc.d++;over=true;draw('A draw.');return true}return false};
  const cpu=()=>{const e=b.map((c,i)=>c?-1:i).filter(i=>i>=0);let mv;
    if(Math.random()<.7){let best=-9,pool=[];for(const i of e){b[i]='O';const s=mm(b,'X');b[i]='';if(s>best){best=s;pool=[i]}else if(s===best)pool.push(i)}mv=pool[Math.random()*pool.length|0]}
    else mv=e[Math.random()*e.length|0];b[mv]='O'};
  body.onclick=ev=>{if(ev.target.closest('[data-new]'))return reset();const t=ev.target.closest('[data-i]');if(!t||over)return;const i=+t.dataset.i;if(b[i])return;
    b[i]='X';if(end())return;cpu();if(end())return;draw('Your move')};
  reset();
}
function gameMemory(){
  const body=gameShell('Memory match'),names=['Chai','Naan','Biryani','Kulfi','Lassi','Jalebi'],cols=['#9a6200','#a8521a','#0e5a45','#2a62c9','#7a3fb0','#c92f1f'];
  let deck,open,matched,moves,lock,to;
  G.stop=()=>clearTimeout(to);
  const draw=()=>{const won=matched.size===12;
    body.innerHTML=`<div class="mem">${deck.map((c,i)=>{const up=open.includes(i)||matched.has(i);return `<button data-i="${i}" class="${up?'up':''} ${matched.has(i)?'done':''}" style="--c:${c.c}" ${up?'disabled':''} aria-label="${up?c.n:'Hidden card'}">${up?c.n:'?'}</button>`}).join('')}</div>
    <p class="muted" style="text-align:center">${won?`Cleared in ${moves} moves.`:'Find the six matching pairs'}</p><div style="text-align:center"><button class="btn small" data-new="1">Shuffle again</button></div>`;
    $('#gscore').textContent=`Moves ${moves}`+(G.memBest?` · Best ${G.memBest}`:'')};
  const reset=()=>{clearTimeout(to);deck=shuffle([...names,...names].map(n=>({n,c:cols[names.indexOf(n)]})));open=[];matched=new Set();moves=0;lock=false;draw()};
  body.onclick=ev=>{if(ev.target.closest('[data-new]'))return reset();const t=ev.target.closest('[data-i]');if(!t||lock)return;const i=+t.dataset.i;if(open.includes(i)||matched.has(i))return;
    open.push(i);if(open.length<2)return draw();
    moves++;const [a,c]=open;
    if(deck[a].n===deck[c].n){matched.add(a);matched.add(c);open=[];if(matched.size===12&&(!G.memBest||moves<G.memBest))G.memBest=moves;draw()}
    else{lock=true;draw();to=setTimeout(()=>{open=[];lock=false;draw()},800)}};
  reset();
}
function gameSnake(){
  const body=gameShell('Snake');
  body.innerHTML=`<canvas id="sc" width="300" height="300" style="width:100%;max-width:340px;aspect-ratio:1;border-radius:12px;touch-action:none;display:block;margin:0 auto" aria-label="Snake game board"></canvas>
   <div class="dpad"><button class="u" data-d="u" aria-label="Up">↑</button><button class="l" data-d="l" aria-label="Left">←</button><button class="dn" data-d="d" aria-label="Down">↓</button><button class="r" data-d="r" aria-label="Right">→</button></div>
   <p id="gmsg" class="muted" style="text-align:center;margin:10px 0 6px"></p><div style="text-align:center"><button class="btn small" data-new="1">Restart</button></div>`;
  const cv=$('#sc'),cx=cv.getContext('2d'),N=15,S=20,cs=getComputedStyle(document.documentElement),col=n=>cs.getPropertyValue(n).trim()||'#0e5a45';
  let snake,dir,next,food,score,timer;
  const msg=t=>{$('#gmsg').textContent=t},sc=()=>{$('#gscore').textContent=`Score ${score} · Best ${G.snakeBest}`};
  const place=()=>{do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x===food.x&&s.y===food.y))};
  const draw=()=>{cx.fillStyle=col('--surface2');cx.fillRect(0,0,300,300);cx.fillStyle=col('--alert');cx.beginPath();cx.arc(food.x*S+10,food.y*S+10,7,0,7);cx.fill();
    cx.fillStyle=col('--brand');snake.forEach((s,i)=>{cx.globalAlpha=i?.8:1;cx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});cx.globalAlpha=1};
  const die=()=>{clearInterval(timer);timer=null;msg(`Game over. Score ${score}. Tap Restart.`)};
  const tick=()=>{dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y))return die();
    snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;if(score>G.snakeBest)G.snakeBest=score;place()}else snake.pop();sc();draw()};
  const reset=()=>{clearInterval(timer);snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir=next={x:1,y:0};score=0;place();msg('Swipe on the board or use the arrows');sc();draw();timer=setInterval(tick,140)};
  const steer=(x,y)=>{if(x===-dir.x&&y===-dir.y)return;next={x,y}};
  const M={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
  body.onclick=ev=>{if(ev.target.closest('[data-new]'))return reset();const t=ev.target.closest('[data-d]');if(t)steer(...M[t.dataset.d])};
  const key=ev=>{const k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[ev.key];if(k){ev.preventDefault();steer(...M[k])}};
  addEventListener('keydown',key);
  let tx,ty;
  cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
    Math.abs(dx)>Math.abs(dy)?steer(dx>0?1:-1,0):steer(0,dy>0?1:-1)},{passive:true});
  G.stop=()=>{clearInterval(timer);removeEventListener('keydown',key)};
  reset();
}
Object.assign(A,{
  savelink:()=>{let v=(document.getElementById('qrlink').value||'').trim().split('#')[0];
    if(!/^https?:\/\/[^\s]+\.[^\s]+/i.test(v)){toast('Paste a full address starting with https://');return}
    try{localStorage.setItem('tl_link',v)}catch(e){}toast('Link saved. Codes updated.');paint(true)},
  clearlink:()=>{try{localStorage.removeItem('tl_link')}catch(e){}paint(true)},
  game:e=>{stopGame();({ttt:gameTTT,mem:gameMemory,snake:gameSnake})[e.g]()},
  gback:()=>gamePicker(),
  lock:()=>{st.staff=false;try{sessionStorage.removeItem('tl_staff')}catch(e){}location.hash='';paint(true)},
  pin:e=>{if(e.d==='del')st.pinEntry=st.pinEntry.slice(0,-1);else if(st.pinEntry.length<4)st.pinEntry+=e.d;
    if(st.pinEntry.length===4){if(st.pinEntry===CFG.pin){st.staff=true;try{sessionStorage.setItem('tl_staff','1')}catch(x){}}else toast('Wrong PIN');st.pinEntry=''}
    paint(true)},
  newmenu:async()=>{if(!D.menu.length)await safe(seedMenu);st.menuSel='new';paint(true)},
  editmenu:async e=>{if(!D.menu.length)await safe(seedMenu);st.menuSel=e.id;paint(true)},
  cancelmenu:()=>{st.menuSel=null;paint(true)},
  toggleoff:async e=>{if(!D.menu.length)await safe(seedMenu);const m=D.menu.find(x=>x.id===e.id);if(m)safe(()=>store.update('menu',m.id,{off:!m.off}),m.off?'Back on the menu':'Marked sold out')},
  delmenu:e=>safe(async()=>{await store.del('menu',e.id);st.menuSel=null;paint(true)},'Dish deleted'),
  savemenu:()=>{
    const g=id=>document.getElementById(id),name=g('mf-name').value.trim(),cat=g('mf-cat').value.trim(),szText=g('mf-sz').value.trim();
    if(!name||!cat||!szParse(szText).length){toast('Add a name, a category and a size like Half:220');return}
    const id=st.menuSel==='new'?'m'+Date.now().toString(36):st.menuSel,prev=D.menu.find(m=>m.id===id);
    safe(async()=>{await store.set('menu',id,{cat,name,d:g('mf-d').value.trim(),veg:+g('mf-veg').value,spice:+g('mf-spice').value,
      al:[...document.querySelectorAll('.mf-al:checked')].map(x=>x.value),szText,off:prev?!!prev.off:false,ord:prev?(prev.ord||0):Math.max(0,...D.menu.map(m=>m.ord||0))+1});
      st.menuSel=null;paint(true)},'Dish saved')}
});
setInterval(()=>{if(['kitchen','floor','guest','sales'].includes(st.view))paint()},30000);
let first=true;
store.init(()=>{checkNew();paint(first);first=false});
route();
</script>
